global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: violence-detector
    static_configs:
      # host.docker.internal resolves to the Docker Desktop host (localhost)
      # where the K8s LoadBalancer exposes port 8000
      - targets: ['host.docker.internal:8000']
    metrics_path: /metrics
