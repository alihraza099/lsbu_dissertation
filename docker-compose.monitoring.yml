version: "3.8"

# Prometheus scrapes the FastAPI /metrics endpoint exposed by the K8s
# LoadBalancer on host port 8000. Grafana auto-provisions the datasource
# and dashboard on first boot.
#
# Start:  docker compose -f docker-compose.monitoring.yml up -d
# Stop:   docker compose -f docker-compose.monitoring.yml down
# UI:     Prometheus → http://localhost:9090
#         Grafana    → http://localhost:3000  (admin / admin)

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data:
